  en: Marital status (RatSWD FAM_1)
short:
  de: Ledig, verheiratet, geschieden, verwitwet
  en: Single, married, divorced, widowed
description:
  de: Basis-Merkmal des RatSWD-Standardfragenkatalogs (2023). Aus den Demographischen Standards nach zwei
    Pretests gekürzt; eine eingetragene Lebenspartnerschaft zählt wie eine Ehe.
  en: Basic characteristic of the RatSWD catalogue of standard questions (2023). From the Demographische
    Standards, shortened after two pretests; a registered civil partnership counts as a marriage.
scoring:
  de: 1 = ledig, 2 = verheiratet, 3 = geschieden, 4 = verwitwet. Daraus KonsortSWD x_marital. −1 = weiß
    nicht, −2 = keine Angabe (fehlend).
  en: 1 = single, 2 = married, 3 = divorced, 4 = widowed. Gives KonsortSWD x_marital. −1 = don't know,
    −2 = no answer (missing).
