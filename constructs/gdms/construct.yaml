version: '1.0'
status: review
kind: scale
requires: '2026.11'
name:
  de: General Decision-Making Style (GDMS)
  en: General Decision-Making Style (GDMS)
short:
  de: '25 Aussagen, 5 Stufen; fünf Entscheidungsstile: rational, intuitiv, abhängig, vermeidend, spontan'
  en: '25 statements, 5 points; five decision-making styles: rational, intuitive, dependent, avoidant,
    spontaneous'
description:
  de: 'Erfasst, wie eine Person gewöhnlich wichtige Entscheidungen trifft, in fünf Stilen mit je fünf
    Items: rational (Informationen suchen, Optionen logisch abwägen), intuitiv (Gefühl und Ahnung), abhängig
    (Rat und Unterstützung anderer), vermeidend (Aufschieben) und spontan (schnell, aus dem Moment). Die
    Stile schließen sich nicht aus; Personen nutzen meist mehrere. Interne Konsistenz im Original .68
    bis .94.'
  en: 'Measures how a person usually makes important decisions, in five styles with five items each: rational
    (searching for information, weighing options logically), intuitive (feelings and hunches), dependent
    (advice and support of others), avoidant (putting decisions off) and spontaneous (quick, on the spur
    of the moment). The styles do not exclude each other; most people use several. Internal consistency
    in the original .68 to .94.'
scoring:
  de: 'Fünf Skalenwerte als Mittelwert je fünf Items (1 bis 5): rational (Items 1, 6, 11, 16, 21), intuitiv
    (2, 7, 12, 17, 22), abhängig (3, 8, 13, 18, 23), vermeidend (4, 9, 14, 19, 24), spontan (5, 10, 15,
    20, 25). Keine Umpolung; kein Gesamtwert, die Stile werden getrennt ausgewertet.'
  en: 'Five scale scores as the mean of five items each (1 to 5): rational (items 1, 6, 11, 16, 21), intuitive
    (2, 7, 12, 17, 22), dependent (3, 8, 13, 18, 23), avoidant (4, 9, 14, 19, 24), spontaneous (5, 10,
    15, 20, 25). No reversed items; no total score, the styles are analysed separately.'
notes:
  de: '© 1995 SAGE Publications. Eintrag in APA PsycTests: https://doi.org/10.1037/t08399-000. Neue Nutzung
    und Katalogzugriff nur mit dokumentierter, vom Betreiber geprüfter Berechtigung für Person, Studie
    und Sprachfassung. Anmeldung allein genügt nicht; keine allgemeine Weitergabe. Quelle immer angeben.
    Nur Englisch: Eine validierte deutsche Fassung der vollständigen Skala gibt es nicht (Fischer, Soyez
    & Gurtner, 2015, haben eine 13-Item-Fassung für Patientenentscheidungen validiert, die nicht dieselbe
    Skala ist); eine eigene Übersetzung ist nicht validiert. Nur die Endpunkte sind beschriftet (Original:
    5 Stufen von „strongly disagree“ bis „strongly agree“). Aussagen in zufälliger Reihenfolge; im Original
    wechseln sich die Stile der Reihe nach ab.'
  en: '© 1995 SAGE Publications. Record in APA PsycTests: https://doi.org/10.1037/t08399-000. New use
    and catalogue access require documented, operator-checked permission covering the account, study and
    language version. Signing in alone is insufficient; no general distribution. Always cite the source.
    English only: there is no validated German version of the full scale (Fischer, Soyez & Gurtner, 2015,
    validated a 13-item version for patient decisions, which is not the same scale); a translation of
    your own is not validated. Only the endpoints are labelled (original: 5 points from “strongly disagree”
    to “strongly agree”). Statements in random order; in the original the styles take turns.'
