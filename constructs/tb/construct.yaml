version: '1.0'
status: verified
kind: scale
requires: '2026.11'
name:
  de: Kurzskala Technikbereitschaft (TB)
  en: Technology Commitment Short Scale (TB)
short:
  de: 12 Aussagen, 5 Stufen; je 4 Items für Technikakzeptanz, Technikkompetenz- und Technikkontrollüberzeugungen
  en: 12 statements, 5 points; 4 items each for technology acceptance, technology competence beliefs and
    technology control beliefs
description:
  de: Erfasst die Bereitschaft zum Umgang mit moderner Technik (technology commitment) über drei Facetten.
    In allen Altersgruppen einsetzbar, entwickelt besonders für das höhere Lebensalter. Cronbachs Alpha
    .84 (Technikakzeptanz), .84 (Technikkompetenz), .74 (Technikkontrolle), Gesamtskala .84.
  en: Measures the readiness to deal with modern technology (technology commitment) through three facets.
    Usable in all age groups, developed especially for older adults. Cronbach's alpha .84 (technology
    acceptance), .84 (technology competence), .74 (technology control), whole scale .84.
scoring:
  de: 'Drei Skalenwerte als Mittelwert je vier Items: Technikakzeptanz (1 bis 4), Technikkompetenzüberzeugungen
    (5 bis 8), Technikkontrollüberzeugungen (9 bis 12); die negativ gepolten Items 5 bis 8 sind im Export
    bereits rekodiert, hohe Werte stehen also überall für hohe Technikbereitschaft. Ein Gesamtwert über
    alle 12 Items ist laut ZIS ebenfalls zulässig (dort als Summenwert beschrieben, Kennwerte im Bereich
    1 bis 5).'
  en: 'Three scale scores as the mean of four items each: technology acceptance (Technikakzeptanz, 1 to
    4), technology competence beliefs (Technikkompetenzüberzeugungen, 5 to 8), technology control beliefs
    (Technikkontrollüberzeugungen, 9 to 12); the negatively keyed items 5 to 8 are already recoded in
    the export, so high values stand for high technology commitment throughout. According to ZIS, a total
    score over all 12 items is also permitted (described there as a sum score, values in the range 1 to
    5).'
