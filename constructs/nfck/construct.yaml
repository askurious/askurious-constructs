requires: '2026.11'
name:
  de: Need for Cognition Kurzskala (NFC-K)
  en: Need for Cognition Short Scale (NFC-K)
short:
  de: 4 Aussagen, 7 Stufen; Freude am und Engagement beim Nachdenken
  en: 4 statements, 7 points; enjoyment of and engagement in thinking
description:
  de: Misst Need for Cognition mit vier Items zu den Facetten Engagement und Freude. Geeignet ab dem Jugendalter;
    Cronbachs Alpha .51 bis .54 (bei vier Items niedrig).
  en: Measures need for cognition with four items on the facets engagement and enjoyment. Suitable from
    adolescence on; Cronbach's alpha .51 to .54 (low with four items).
scoring:
  de: Skalenwert = Mittelwert der 4 Items (1 bis 7); Items 1 und 4 sind im Export bereits rekodiert.
  en: Scale score = mean of the 4 items (1 to 7); items 1 and 4 are already recoded in the export.
