name:
  de: Interpersonales Vertrauen (KUSIV3)
  en: Interpersonal Trust Short Scale (KUSIV3)
short:
  de: 3 Aussagen, 5 Stufen; Vertrauen in andere Menschen als Persönlichkeitsmerkmal
  en: 3 statements, 5 points; trust in other people as a personality trait
description:
  de: Kurzskala zur Messung des zwischenmenschlichen Vertrauens mit drei Items (Bearbeitung etwa 30 Sekunden).
  en: Short scale measuring interpersonal trust with three items (about 30 seconds to answer).
scoring:
  de: Skalenwert = Mittelwert der 3 Items; Item 2 ist negativ formuliert und im Export bereits rekodiert
    (Nießen et al., 2020).
  en: Scale score = mean of the 3 items; item 2 is worded negatively and already recoded in the export
    (Nießen et al., 2020).
