short:
  de: Hauptstatus in neun Kategorien
  en: Main status in nine categories
description:
  de: 'Minimalversion des RatSWD-Standardfragenkatalogs (2023), mit KonsortSWD entwickelt und vorgetestet.
    Derzeitige Situation (Hauptstatus): erwerbstätig in Vollzeit oder Teilzeit oder sieben Gründe, hauptberuflich
    nicht erwerbstätig zu sein, mit Textfeld für „aus anderen Gründen“.'
  en: 'Minimal version of the RatSWD catalogue of standard questions (2023), developed with KonsortSWD
    and pretested. Current situation (main status): employed full or part time, or seven reasons for not
    being employed in a main job, with a text field for “other reasons”.'
scoring:
  de: 1 bis 9 wie im Katalog; Text zu 9 in einer eigenen Spalte. Daraus KonsortSWD x_mainstatus. −1 =
    weiß nicht (fehlend).
  en: 1 to 9 as in the catalogue; the text for 9 in a column of its own. Gives KonsortSWD x_mainstatus.
    −1 = don't know (missing).
notes:
  de: 'Lizenz: CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/), frei nutzbar mit Quellenangabe;
    Änderungen kennzeichnen (das Codebuch nennt Abweichungen vom Wortlaut). „Weiß nicht“ (−1) und „Keine
    Angabe“ (−2) zählen als fehlend. Standardfrage: nicht Teil der gemeinsamen Auswertung der Konstrukte
    (Pool). Englische Fassung: inoffizielle Arbeitsübersetzung.'
  en: 'Licence: CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/), free to use with attribution;
    mark changes (the codebook lists deviations from the wording). “Don''t know” (−1) and “No answer”
    (−2) count as missing. Standard question: not part of the pooled analysis of the constructs (pool).
    English version: unofficial working translation.'
