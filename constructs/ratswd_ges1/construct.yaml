short:
  de: Männlich, weiblich, divers
  en: Male, female, diverse
description:
  de: Basis-Merkmal des RatSWD-Standardfragenkatalogs (2023). Aus den Demographischen Standards (2016),
    mit „divers“ als dritter Antwort wie im Personenstandsgesetz. Für Geschlechtsidentität mit Selbstbeschreibung
    gibt es das Konstrukt „Geschlecht“ nach Spiel et al. (2019).
  en: Basic characteristic of the RatSWD catalogue of standard questions (2023). From the Demographische
    Standards (2016), with “divers” as a third answer as in the German civil status law. For gender identity
    with self-description there is the construct “Gender” after Spiel et al. (2019).
scoring:
  de: 1 = männlich, 2 = weiblich, 3 = divers; gleiche Codes wie KonsortSWD x_sex.
  en: 1 = male, 2 = female, 3 = diverse; the same codes as KonsortSWD x_sex.
