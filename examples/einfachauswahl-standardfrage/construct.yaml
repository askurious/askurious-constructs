# Beispiel: Standardfrage als Einfachauswahl. Antworten über ihre Codes; ein Code unter null zählt als fehlend.
# Example: standard question as single choice. Answers by their codes; a code below zero counts as missing.
format: 1
id: ask:beispiel_standardfrage
key: beispiel_standardfrage
