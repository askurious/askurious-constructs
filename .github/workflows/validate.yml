name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Validate constructs (schema, licence, languages, versions)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/validate.py --base "origin/${{ github.base_ref }}"
          else
            python tools/validate.py --base "${{ github.event.before }}"
          fi
      - name: Build manifest
        run: python tools/build.py --release 0000.00.0
      - name: REUSE
        run: reuse lint
      - name: Tests
        run: pytest
