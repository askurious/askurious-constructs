name:
  de: 'TAM: Wahrgenommene Benutzerfreundlichkeit (Perceived Ease of Use)'
  en: 'TAM: Perceived Ease of Use'
short:
  de: 6 Aussagen, 7 Stufen; Technology Acceptance Model (Davis, 1989)
  en: 6 statements, 7 points; Technology Acceptance Model (Davis, 1989)
description:
  de: Grad, in dem eine Person glaubt, dass die Nutzung eines Systems mühelos ist. Kernkonstrukt des Technology
    Acceptance Model (TAM); Reliabilität im Original .94.
  en: Degree to which a person believes that using a system is free of effort. Core construct of the Technology
    Acceptance Model (TAM); reliability in the original .94.
scoring:
  de: Skalenwert = Mittelwert der 6 Items (1 bis 7); keine Umpolung.
  en: Scale score = mean of the 6 items (1 to 7); no reverse coding.
notes:
  de: Für den Wortlaut und seine Übersetzungen ist keine allgemeine Nutzungs- oder Veröffentlichungsfreigabe
    dokumentiert. Die Angabe „nichtkommerzielle Forschung und Lehre“ allein ersetzt keinen Rechtebeleg.
    Neue Nutzung setzt einen vom Betreiber geprüften Nachweis für die konkrete Studie, Person und Sprachfassung
    voraus. Die Quelle ist immer anzugeben. „[System]“ durch den Namen der Technik ersetzen (zählt nicht
    als Veränderung). Englischer Wortlaut wie veröffentlicht; deutsche Fassung ist eine inoffizielle Arbeitsübersetzung.
    Davis (1989) nutzte 7-stufige Skalen (likely/unlikely; in Studie 1 agree/disagree), im Original steht
    „likely“ links; hier 1 = äußerst unwahrscheinlich, 7 = äußerst wahrscheinlich.
  en: No general use or publication permission is documented for the wording or its translations. Stating
    “non-commercial research and teaching” alone does not replace rights evidence. New use requires operator-checked
    evidence covering the specific study, account and language version. Always cite the source. Replace
    “[System]” with the name of the technology (does not count as a change). English wording as published;
    the German version is an unofficial working translation. Davis (1989) used 7-point scales (likely/unlikely;
    in study 1 agree/disagree), with “likely” on the left in the original; here 1 = extremely unlikely,
    7 = extremely likely.
