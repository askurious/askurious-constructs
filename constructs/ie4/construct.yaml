  en: Internal-External Locus of Control 4 (IE-4)
short:
  de: 4 Aussagen, 5 Stufen; je 2 Items für internale und externale Kontrollüberzeugung
  en: 4 statements, 5 points; 2 items each for internal and external locus of control
description:
  de: 'Kurzskala zur Kontrollüberzeugung: Wie sehr erleben Personen Ereignisse als Folge des eigenen Handelns
    (internal) oder als Schicksal, Zufall oder von anderen bestimmt (external)?'
  en: 'Short scale on locus of control: how much do people experience events as a result of their own
    actions (internal) or as fate, chance or determined by others (external)?'
scoring:
  de: 'Zwei Skalenwerte: Mittelwert der Items 1 und 2 (internal, IKÜ) und der Items 3 und 4 (external,
    EKÜ); keine Umpolung.'
  en: 'Two scale scores: mean of items 1 and 2 (internal, IKÜ) and of items 3 and 4 (external, EKÜ); no
    reverse coding.'
