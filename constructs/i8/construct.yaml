name:
  de: Impulsives-Verhalten-8 (I-8)
  en: Impulsive Behavior Short Scale–8 (I-8)
short:
  de: 8 Aussagen, 5 Stufen; Dringlichkeit, Absicht, Ausdauer, Risikobereitschaft
  en: 8 statements, 5 points; urgency, premeditation, perseverance, sensation seeking
description:
  de: Kurzskala zu vier Facetten impulsiven Verhaltens mit je zwei Items. Hohe Werte bei Dringlichkeit
    und Risikobereitschaft stehen für hohe, bei Absicht und Ausdauer für niedrige Impulsivität.
  en: Short scale on four facets of impulsive behaviour with two items each. High values on urgency and
    sensation seeking stand for high impulsivity, on premeditation and perseverance for low impulsivity.
scoring:
  de: 'Vier Skalenwerte als Mittelwert je zwei Items: Dringlichkeit (1, 2), Absicht (3, 4), Ausdauer (5,
    6), Risikobereitschaft (7, 8); keine Umpolung.'
  en: 'Four scale scores as the mean of two items each: urgency (Dringlichkeit; 1, 2), premeditation (Absicht;
    3, 4), perseverance (Ausdauer; 5, 6), sensation seeking (Risikobereitschaft; 7, 8); no reverse coding.'
