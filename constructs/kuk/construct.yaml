name:
  de: Kontrollüberzeugung beim Kochen
  en: Locus of control in cooking
short:
  de: 10 Aussagen, 6 Stufen; Selbsteinschätzung als Koch
  en: 10 statements, 6 points; self-assessment as a cook
description:
  de: 'Erfasst, wie sicher und kompetent sich eine Person beim Kochen erlebt: Überforderung oder Souveränität,
    Freude am Ausprobieren, Anerkennung durch andere. Eingesetzt in einer Studie zur Akzeptanz von Serious
    Games zum kognitiven Training im Umfeld von Ambient Assisted Living.'
  en: 'Measures how confident and competent a person feels when cooking: overwhelmed or in command, enjoying
    trying things out, recognition from others. Used in a study on the acceptance of serious games for
    cognitive training in ambient assisted living.'
scoring:
  de: Skalenwert = Mittelwert der 10 Items (1 bis 6); die negativ formulierten Items 1, 5 und 9 sind im
    Export bereits rekodiert, hohe Werte stehen also für hohe Kontrollüberzeugung beim Kochen.
  en: Scale score = mean of the 10 items (1 to 6); the negatively worded items 1, 5 and 9 are already
    recoded in the export, so high values stand for a strong sense of control in cooking.
