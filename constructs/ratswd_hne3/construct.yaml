name:
  de: Haushaltsnettoeinkommen grob (RatSWD HNE_3)
  en: Household net income, rough (RatSWD HNE_3)
short:
  de: 'Drei Klassen: unter 1.500, bis 3.000, ab 3.000 Euro'
  en: 'Three classes: under 1,500, to 3,000, from 3,000 euros'
description:
  de: Basis-Merkmal des RatSWD-Standardfragenkatalogs (2023). Geschlossene Frage mit „unfolding brackets“
    nach NEPS (erste Frage); die Folgefragen HNE_4 bis HNE_6 teilen jede Klasse in drei. Der Katalog stellt
    sie nach der offenen Frage HNE_1; der Fragetext beginnt deshalb mit „Es würde uns schon helfen …“.
  en: Basic characteristic of the RatSWD catalogue of standard questions (2023). Closed question with
    unfolding brackets after NEPS (first question); the follow-ups HNE_4 to HNE_6 split each class into
    three. The catalogue asks it after the open question HNE_1, so the question starts with “It would
    already help us …”.
scoring:
  de: 1 = unter 1.500 Euro, 2 = 1.500 bis unter 3.000 Euro, 3 = 3.000 Euro und mehr. −1 = weiß nicht,
    −2 = keine Angabe (fehlend).
  en: 1 = under 1,500 euros, 2 = 1,500 to under 3,000 euros, 3 = 3,000 euros or more. −1 = don't know,
    −2 = no answer (missing).
