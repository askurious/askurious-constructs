  de: Weiblich, männlich, divers, Selbstbeschreibung, keine Angabe
  en: Female, male, diverse, self-description, prefer not to disclose
description:
  de: 'Geschlechtsidentität nach den Empfehlungen von Spiel et al. für inklusivere Geschlechtsabfragen:
    weiblich, männlich, divers, „Ich beschreibe mich selbst:“ mit Textfeld und „keine Angabe“. Die Selbstbeschreibung
    lässt sich je Element abwählen; das gilt nicht als Abweichung.'
  en: 'Gender identity following the recommendations of Spiel et al. for more inclusive gender questions:
    female, male, diverse, “Prefer to self-describe:” with a text field, and “prefer not to disclose”.
    The self-description can be left out per element; that does not count as a deviation.'
