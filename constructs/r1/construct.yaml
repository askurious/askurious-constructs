requires: '2026.11'
name:
  de: Kurzskala Risikobereitschaft (R-1)
  en: Risk Proneness Short Scale (R-1)
short:
  de: 1 Frage, 7 Stufen; allgemeine Neigung, Risiken einzugehen
  en: 1 question, 7 points; general tendency to take risks
description:
  de: Erfasst die Risikobereitschaft, also die Neigung, Risiken einzugehen oder zu vermeiden, mit einer
    einzigen Frage (unter 20 Sekunden). Für die deutschsprachige Allgemeinbevölkerung ab 18 Jahren entwickelt;
    Retest-Reliabilität .74 (englische Fassung .76).
  en: Measures risk proneness, the tendency to take or avoid risks, with a single question (under 20 seconds).
    Developed for the German-speaking general population aged 18 and over; retest reliability .74 (English
    version .76).
scoring:
  de: Skalenwert = Antwort auf die eine Frage (1 = gar nicht risikobereit bis 7 = sehr risikobereit);
    keine Umpolung. Bei einem einzelnen Item gibt es keine interne Konsistenz (kein Cronbachs Alpha).
  en: Scale score = the answer to the one question (1 = not at all willing to take risks to 7 = very willing
    to take risks); no reverse coding. A single item has no internal consistency (no Cronbach's alpha).
