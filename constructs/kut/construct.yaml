name:
  de: Kontrollüberzeugung im Umgang mit Technik (KUT)
  en: Locus of control in dealing with technology (KUT)
short:
  de: 8 Aussagen, 5 Stufen; subjektive Kontrolle über technische Geräte
  en: 8 statements, 5 points; subjective control over technical devices
description:
  de: Erfasst, inwieweit Personen glauben, technische Probleme durch eigenes Handeln lösen zu können (internal)
    oder sich Technik ausgeliefert fühlen.
  en: Measures to what extent people believe they can solve technical problems through their own actions
    (internal) or feel at the mercy of technology.
scoring:
  de: Skalenwert = Mittelwert der 8 Items; umgepolte Items (2, 3, 5, 6) sind im Export bereits rekodiert.
  en: Scale score = mean of the 8 items; the reverse-coded items (2, 3, 5, 6) are already recoded in the
    export.
