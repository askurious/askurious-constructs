requires: '2026.11'
name:
  de: Big Five Inventory (BFI-10)
  en: Big Five Inventory (BFI-10)
short:
  de: 10 Aussagen, 5 Stufen; je 2 Items für Extraversion, Verträglichkeit, Gewissenhaftigkeit, Neurotizismus,
    Offenheit
  en: 10 statements, 5 points; 2 items each for extraversion, agreeableness, conscientiousness, neuroticism,
    openness
description:
  de: Ultrakurzform des Big Five Inventory für Befragungen mit wenig Zeit. Erfasst die fünf Persönlichkeitsdimensionen
    mit je einem positiv und einem negativ gepolten Item.
  en: Ultra-short form of the Big Five Inventory for surveys with little time. Measures the five personality
    dimensions with one positively and one negatively keyed item each.
scoring:
  de: 'Skalenwerte = Mittelwert je Subskala (E: 1, 6; A: 2, 7; C: 3, 8; N: 4, 9; O: 5, 10); die negativ
    gepolten Items 1, 3, 4, 5 und 7 sind im Export bereits rekodiert.'
  en: 'Scale scores = mean per subscale (E: 1, 6; A: 2, 7; C: 3, 8; N: 4, 9; O: 5, 10); the negatively
    keyed items 1, 3, 4, 5 and 7 are already recoded in the export.'
notes:
  de: 'GESIS/ZIS: kostenfrei für nichtkommerzielle Forschungszwecke. Für andere Zwecke oder eine andere
    als die dokumentierte Form ist das Einverständnis der Autorinnen und Autoren einzuholen. Die ZIS-Dokumentation
    ist in allen resultierenden Arbeiten als Quelle anzugeben. Deutscher Wortlaut geprüft gegen ZIS; englische
    Instruktion und Endpunkte nach Rammstedt & John (2007). Die englischen Items stammen aus dem Big Five
    Inventory (John, Donahue & Kentle, 1991; © Oliver P. John), das für nichtkommerzielle Forschung frei
    genutzt werden darf.'
  en: 'GESIS/ZIS: free of charge for non-commercial research. For other purposes or a form other than
    the documented one, ask the authors for permission. Cite the ZIS documentation as the source in all
    resulting work. German wording checked against ZIS; English instruction and endpoints after Rammstedt
    & John (2007). The English items come from the Big Five Inventory (John, Donahue & Kentle, 1991; ©
    Oliver P. John), free to use for non-commercial research.'
