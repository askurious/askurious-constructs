requires: '2026.11'
name:
  de: Allgemeine Selbstwirksamkeit Kurzskala (ASKU)
  en: General Self-Efficacy Short Scale (ASKU)
short:
  de: 3 Aussagen, 5 Stufen; Erwartung, Schwierigkeiten aus eigener Kraft zu bewältigen
  en: 3 statements, 5 points; expectation of coping with difficulties on one's own
description:
  de: Ökonomisches Instrument zur Erfassung individueller Kompetenzerwartungen, mit Schwierigkeiten und
    Hindernissen im täglichen Leben umgehen zu können. McDonalds Omega .81 bis .87.
  en: Economical instrument measuring the individual expectation of being able to deal with difficulties
    and obstacles in daily life. McDonald's omega .81 to .87.
scoring:
  de: Skalenwert = Mittelwert der 3 Items (1 bis 5).
  en: Scale score = mean of the 3 items (1 to 5).
